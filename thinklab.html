<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1Flow - Think Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="topbar">
    <button class="brand" data-page="home" aria-label="Go to home">
      <span class="brand-mark">F1</span>
      <span class="brand-name">F1Flow</span>
    </button>
    <label class="social-search" aria-label="Search F1Flow">
      <span>Search</span>
      <input id="global-search" type="search" placeholder="Search students, mentors, schools">
    </label>
    <div class="nav-links" aria-label="Primary navigation">
      <button class="nav-link active" data-page="home">Home</button>
      <button class="nav-link" data-page="profiles">Profiles</button>
      <button class="nav-link" data-page="dashboard">Dashboard</button>
      <button class="nav-link" data-page="mentors">Mentors</button>
      <button class="nav-link" data-page="community">Community</button>
      <button class="nav-link" data-page="travel">Travel</button>
      <button class="nav-link" data-page="thinklab">Think Lab</button>
      <button class="nav-link" data-page="arrival">Arrival</button>
      <button class="nav-link" data-page="login">Login</button>
    </div>
    <div class="nav-actions">
      <button class="icon-btn nav-settings" id="settings-toggle" aria-label="Settings" title="Settings">⚙️</button>
      <button class="nav-cta" id="open-profile">Get Started</button>
    </div>
  </nav>

  <main>
    <section id="page-thinklab" class="page shell active">
      <header class="page-header">
        <h2>Think Lab</h2>
        <p>Post ideas, get validation, and find collaborators.</p>
      </header>
      <div class="toolbar">
        <button class="btn primary" id="submit-idea">Submit Idea</button>
        <div class="chips" id="idea-filters"></div>
      </div>
      <div class="card-grid" id="ideas-grid"></div>
    </section>
  </main>

  <div class="modal" id="profile-modal" aria-hidden="true">
    <form class="modal-panel" id="profile-form">
      <button type="button" class="icon-btn" id="close-profile" aria-label="Close">×</button>
      <h2>Set Up Your Profile</h2>
      <p>This personalizes your timeline, mentor matches, and travel groups.</p>
      <label>Your Name<input name="name" type="text" placeholder="Fredrick Kamau" required></label>
      <div class="split">
        <label>Home Country<input name="country" type="text" list="african-countries" placeholder="Search any country"></label>
        <label>Status<select name="status"><option>Current International Student</option><option>Student Arriving</option><option>Mentor / Alumni</option><option>Lecturer / Educator</option></sele[...]
      </div>
      <label>Destination Institution<input name="university" type="text" list="us-universities" placeholder="University, college, or school"></label>
      <div class="split">
        <label>Program Start<input name="programStart" type="month" value="2023-08"></label>
        <label>Graduation Date<input name="graduation" type="month" value="2025-05"></label>
      </div>
      <label>Field of Study<select name="field"><option>Health Informatics</option><option>Computer Science</option><option>Data Science</option><option>Business</option><option>Engineering</optio[...]
      <button class="btn primary full" type="submit">Go to My Dashboard</button>
    </form>
  </div>


  <datalist id="us-universities"></datalist>
  <datalist id="african-countries"></datalist>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="database.js"></script>
  <script src="app.js"></script>
</body>
</html>
